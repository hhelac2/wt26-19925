<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrolna lista - priprema aktivnosti</title>
    <link rel="stylesheet" href="z1.css">
</head>
<body>
    <main>
        <h1>Kontrolna lista za pripremu aktivnosti</h1>

        <p id="sazetak">Završeno: 0 / 0</p>

        <ul id="lista">
            <li class="stavka">
                <span class="tekst">Odabrati temu aktivnosti</span>
                <button type="button" class="dugme-stanje">Označi kao završeno</button>
            </li>
            <li class="stavka">
                <span class="tekst">Rezervisati prostoriju</span>
                <button type="button" class="dugme-stanje">Označi kao završeno</button>
            </li>
            <li class="stavka">
                <span class="tekst">Pozvati učesnike</span>
                <button type="button" class="dugme-stanje">Označi kao završeno</button>
            </li>
            <li class="stavka">
                <span class="tekst">Pripremiti materijale</span>
                <button type="button" class="dugme-stanje">Označi kao završeno</button>
            </li>
            <li class="stavka">
                <span class="tekst">Provjeriti opremu (projektor, laptop)</span>
                <button type="button" class="dugme-stanje">Označi kao završeno</button>
            </li>
        </ul>

        <button type="button" id="reset">Vrati sve na početno stanje</button>
    </main>

    <script src="z1.js"></script>
</body>
</html>
